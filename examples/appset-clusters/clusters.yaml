# Argo CD cluster secrets, as they live in the Argo CD namespace. An export of
#   kubectl -n argocd get secret -l argocd.argoproj.io/secret-type=cluster -o yaml
# can be passed in as-is; only the labels and the name/server/project fields are read.
apiVersion: v1
kind: Secret
metadata:
  name: staging-cluster
  labels:
    argocd.argoproj.io/secret-type: cluster
    environment: staging
stringData:
  name: staging
  server: https://staging.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: production-cluster
  labels:
    argocd.argoproj.io/secret-type: cluster
    environment: production
stringData:
  name: production
  server: https://production.example.com
