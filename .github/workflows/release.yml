name: Release

# semantic-release decides whether the commits since the last tag warrant a
# release, then drives the whole thing: it creates the tag and the GitHub
# release, and calls the same make targets that are used locally to produce the
# binaries and the image. There is deliberately no `push: tags` trigger — a tag
# created here with GITHUB_TOKEN would not start another workflow anyway, and a
# second path to publishing would only be able to disagree with this one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the tags and the full history to work out the
          # next version.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
